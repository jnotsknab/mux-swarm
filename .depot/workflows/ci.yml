# Depot CI Migration
# Source: .github\workflows\ci.yml
#
# No changes were necessary.

name: CI/CD
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main, development]
permissions:
  contents: write
env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT_PATH: "."
jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            label: Windows x64
            artifact: mux-swarm-win-x64
            extension: .exe
          - os: ubuntu-latest
            rid: linux-x64
            label: Linux x64
            artifact: mux-swarm-linux-x64
            extension: ""
          - os: macos-latest
            rid: osx-arm64
            label: macOS ARM64
            artifact: mux-swarm-osx-arm64
            extension: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore dependencies
        run: dotnet restore
      - name: Run tests
        run: dotnet test MuxSwarm.Tests --configuration Release --no-restore --verbosity normal
      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT_PATH }} -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o ./publish

      # Quick sanity check — does the binary exist and run?
      - name: Verify binary
        shell: bash
        run: |
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            ls -lh ./publish/MuxSwarm.exe
          else
            ls -lh ./publish/MuxSwarm
            chmod +x ./publish/MuxSwarm
          fi
      # End-to-end self-test harness: run the PUBLISHED binary's built-in checks (--selftest) against
      # generated dummy configs, so first-run setup is bypassed and real control flows (downloads,
      # detached spawns, network health) are exercised. Add new flows as checks in Engine/SelfTest.cs;
      # this step runs them all. MUX_CLIPROXY_HOME isolates the proxy.
      # Runs only where the host can execute the artifact: Depot CI sandboxes are Linux x86_64 only
      # (non-Depot runs-on labels fall back to depot-ubuntu-latest), so cross-compiled win/osx legs
      # skip with a notice here and execute automatically on any native runner.
      - name: Self-test (published binary)
        shell: bash
        timeout-minutes: 10
        run: |
          set -u
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)            HOST=linux-x64 ;;
            Linux-aarch64)           HOST=linux-arm64 ;;
            Darwin-arm64)            HOST=osx-arm64 ;;
            Darwin-x86_64)           HOST=osx-x64 ;;
            MINGW*-x86_64|MSYS*-x86_64|CYGWIN*-x86_64) HOST=win-x64 ;;
            *)                       HOST=unknown ;;
          esac
          if [ "$HOST" != "${{ matrix.rid }}" ]; then
            echo "::notice::Self-test skipped for ${{ matrix.rid }}: host is $HOST ($(uname -sm)); a cross-compiled artifact cannot execute here."
            exit 0
          fi
          ST="$RUNNER_TEMP/mux-selftest"
          mkdir -p "$ST/cfg" "$ST/proxy"
          echo '{ "setupCompleted": true, "llmProviders": [], "mcpServers": {} }' > "$ST/cfg/Config.json"
          echo '{}' > "$ST/cfg/Swarm.json"
          export MUX_CLIPROXY_HOME="$ST/proxy"
          BIN="./publish/MuxSwarm${{ matrix.extension }}"
          set +e
          "$BIN" --cfg "$ST/cfg/Config.json" --swarmcfg "$ST/cfg/Swarm.json" --selftest all 2>&1 | tee "$ST/selftest.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "selftest exit code: $rc"
          exit $rc

      - name: Self-test cleanup
        if: always()
        shell: bash
        run: |
          # The sidecar is detached by design; never leave it running on the runner.
          case "$(uname -s)" in
            MINGW*|MSYS*|CYGWIN*) taskkill //F //IM cli-proxy-api.exe >/dev/null 2>&1 || true ;;
            *) pkill -f "$RUNNER_TEMP/mux-selftest/proxy" >/dev/null 2>&1 || true ;;
          esac

      - name: Upload self-test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-${{ matrix.rid }}
          path: ${{ runner.temp }}/mux-selftest/
          retention-days: 7

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ./publish/
          retention-days: 14
